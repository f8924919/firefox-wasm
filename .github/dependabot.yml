version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # node は LTS (現行 22) を維持、ubuntu は Gecko ビルド用ツールチェーンの
    # 検証済み構成を維持するため、メジャー更新の提案は受けない。
    # (ベースイメージ内のパッチ更新や脆弱性アラートはこの設定でも届く)
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major"]
